navigation:
  - flow:
      id: review
      label: Review answers
      baseURL: https://review.example.com
      start:
        input:
          label: X
          capture: x
          next:
            input:
              label: Y
              capture: y
              next:
                input:
                  label: Z
                  capture: z
                  next:
                    input:
                      label: W
                      capture: w
                      next:
                        destination:
                          template: "/x/{x}/y/{y}/z/{z}/w/{w}"
